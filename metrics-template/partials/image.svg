<% if (plugins.pagespeed) { %>
<%
  const m = plugins.pagespeed.mobile
  const d = plugins.pagespeed.desktop
  const entries = [
    ['Performance',    'performance'],
    ['Accessibility',  'accessibility'],
    ['Best Practices', 'best-practices'],
    ['SEO',            'seo'],
  ]
  const color = v => v >= 90 ? '#a6e3a1' : v >= 50 ? '#f9e2af' : '#f38ba8'
  const bar   = v => '█'.repeat(Math.round(v / 5)) + '░'.repeat(20 - Math.round(v / 5))
  const label = (l) => (l + ' ').padEnd(16)
%>
<div class="stdin"><span class="diff">alext@github-profile</span><span class="ps1-location">~$</span> pagespeed <span class="ps1-path"><%= plugins.pagespeed.url %></span></div>
<div class="stdout">
<span class="diff"><%= 'Mobile'.padEnd(16) %></span>
<% for (const [lbl, key] of entries) { %>
  <span class="diff"><%= label(lbl) %></span><span style="color:<%= color(m[key]) %>"><%= bar(m[key]) %> <%= String(m[key]).padStart(3) %></span>
<% } %>
<span class="diff"><%= 'Desktop'.padEnd(16) %></span>
<% for (const [lbl, key] of entries) { %>
  <span class="diff"><%= label(lbl) %></span><span style="color:<%= color(d[key]) %>"><%= bar(d[key]) %> <%= String(d[key]).padStart(3) %></span>
<% } %>
</div>
<% } %>
