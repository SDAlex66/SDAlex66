name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://alextula.com
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
